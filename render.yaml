services:
  - type: web
    name: ine-price-tracker-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOCK_STORE_URL
        value: https://demo.inelabteamdev.com
      - key: HEADLESS
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
